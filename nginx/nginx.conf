# Per-IP request throttling. Auth endpoints are limited much harder than the API.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=20r/s;

server {
    listen 443 ssl;
    server_name saesdockerprod01;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Keep in sync with MAX_UPLOAD_MB * MAX_FILES_PER_JOB expectations.
    client_max_body_size 50M;

    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_pass http://app:8000;
    }

    location / {
        limit_req zone=api_zone burst=40 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_pass http://app:8000;
        proxy_read_timeout 600s;
    }
}

server {
    listen 80;
    server_name saesdockerprod01;
    return 301 https://$host$request_uri;
}
